<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus Garden | Plant a stretch of focus</title>
<style>
:root{--bg:#10231f;--panel:#17332d;--line:#2a4d44;--leaf:#7bd88f;--sun:#ffd166;--soil:#8a5a3c;--text:#e6f2ea;--mute:#9bb8ac;--bad:#ff8a7a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6}
main{max-width:720px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}
.timer{display:grid;justify-items:center;gap:12px}
.ring{position:relative;width:220px;height:220px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--leaf);stroke-linecap:round;transition:stroke-dashoffset .5s linear}
.center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.plant{font-size:3.4rem;line-height:1}
.time{font-size:1.8rem;font-variant-numeric:tabular-nums;font-weight:700}
label{display:block;width:100%;color:var(--mute);font-size:.9rem}
input[type=text]{width:100%;margin-top:4px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:1rem}
.presets{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{font:inherit;cursor:pointer;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--text);padding:8px 16px}
button:hover{border-color:var(--leaf)}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
button.on{background:var(--leaf);color:#0b1d18;border-color:var(--leaf);font-weight:700}
.go{background:var(--sun);color:#2b1d00;border-color:var(--sun);font-weight:700;font-size:1.05rem;padding:12px 32px}
.stop{border-color:var(--bad);color:var(--bad)}
button:disabled{opacity:.4;cursor:not-allowed}
.msg{min-height:1.6em;margin:0;text-align:center;color:var(--sun)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:1.5rem;color:var(--leaf)}
.stats span{color:var(--mute);font-size:.85rem}
.garden{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;min-height:60px}
.cell{aspect-ratio:1;display:grid;place-items:center;font-size:1.9rem;background:linear-gradient(var(--panel) 70%,var(--soil) 70%);border-radius:10px;border:1px solid var(--line)}
.empty{color:var(--mute);grid-column:1/-1}
ul{list-style:none;margin:0;padding:0;max-height:220px;overflow:auto}
li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.95rem}
li small{color:var(--mute)}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
h2{font-size:1.1rem;margin:0}
.link{border:0;color:var(--mute);font-size:.85rem;padding:4px 8px;text-decoration:underline}
@media (prefers-reduced-motion:reduce){.ring .fg{transition:none}}
</style>
</head>
<body>
<main>
  <h1>🌱 Focus Garden</h1>
  <p class="sub">Finish the countdown and your seed grows into a tree. Quit early and it withers.</p>

  <section class="panel timer" aria-label="Timer">
    <div class="ring">
      <svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="45"/><circle class="fg" id="fg" cx="50" cy="50" r="45"/></svg>
      <div class="center"><div class="plant" id="plant">🌰</div><div class="time" id="time">25:00</div></div>
    </div>
    <label for="task">What will you focus on?
      <input type="text" id="task" maxlength="30" placeholder="e.g. Write midterm report">
    </label>
    <div class="presets" id="presets" role="group" aria-label="Choose focus time">
      <button data-m="1">1 min (test)</button>
      <button data-m="15">15 min</button>
      <button data-m="25" class="on">25 min</button>
      <button data-m="45">45 min</button>
    </div>
    <div>
      <button class="go" id="start">Start planting</button>
      <button class="stop" id="giveup" hidden>Give up</button>
    </div>
    <p class="msg" id="msg" role="status"></p>
  </section>

  <section class="panel stats" aria-label="Stats">
    <div><b id="sToday">0</b><span>Minutes today</span></div>
    <div><b id="sTrees">0</b><span>Trees planted</span></div>
    <div><b id="sRate">0%</b><span>Success rate</span></div>
  </section>

  <section class="panel">
    <div class="row"><h2>My garden</h2><button class="link" id="clear">Clear garden</button></div>
    <div class="garden" id="garden"></div>
  </section>

  <section class="panel">
    <h2 style="margin-bottom:8px">Recent sessions</h2>
    <ul id="log"></ul>
  </section>
</main>

<script>
(function(){
  var KEY="focusGarden.v1", C=2*Math.PI*45;
  var $=function(id){return document.getElementById(id)};
  var fg=$("fg"), minutes=25, endAt=0, total=0, timer=null, history=[];
  fg.style.strokeDasharray=C; fg.style.strokeDashoffset=C;

  function load(){try{history=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){history=[]}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(history))}catch(e){}}
  function fmt(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
  function tree(m){return m>=45?"🌲":m>=25?"🌳":m>=15?"🌷":"🌱"}
  function stage(p){return p<.25?"🌰":p<.5?"🌱":p<.8?"🌿":"🪴"}
  function say(t){$("msg").textContent=t}

  function render(){
    var ok=history.filter(function(h){return h.ok});
    var today=new Date().toDateString();
    var mins=ok.filter(function(h){return new Date(h.t).toDateString()===today}).reduce(function(a,h){return a+h.m},0);
    $("sToday").textContent=mins; $("sTrees").textContent=ok.length;
    $("sRate").textContent=history.length?Math.round(ok.length/history.length*100)+"%":"0%";
    var g=$("garden"); g.innerHTML="";
    if(!history.length){g.innerHTML='<p class="empty">Your garden is empty. Finish a session to plant your first tree.</p>'}
    history.slice(-60).forEach(function(h){
      var d=document.createElement("div"); d.className="cell";
      d.textContent=h.ok?tree(h.m):"🥀"; d.title=(h.task||"Untitled")+" · "+h.m+" min · "+(h.ok?"completed":"gave up"); g.appendChild(d);
    });
    var l=$("log"); l.innerHTML="";
    history.slice(-8).reverse().forEach(function(h){
      var li=document.createElement("li"), n=document.createElement("span"), t=document.createElement("small");
      n.textContent=(h.ok?"✅ ":"🥀 ")+(h.task||"Untitled")+" ("+h.m+" min)";
      t.textContent=new Date(h.t).toLocaleString("en-US",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
      li.appendChild(n); li.appendChild(t); l.appendChild(li);
    });
  }

  function setRunning(r){
    $("start").hidden=r; $("giveup").hidden=!r; $("task").disabled=r;
    document.querySelectorAll("#presets button").forEach(function(b){b.disabled=r});
  }
  function reset(){fg.style.strokeDashoffset=C; $("plant").textContent="🌰"; $("time").textContent=fmt(minutes*60); document.title="Focus Garden | Plant a stretch of focus"}

  function tick(){
    var left=Math.round((endAt-Date.now())/1000);
    var p=1-left/total;
    fg.style.strokeDashoffset=C*(1-Math.min(1,p));
    $("plant").textContent=stage(p); $("time").textContent=fmt(left);
    document.title=fmt(left)+" focusing";
    if(left<=0) finish(true);
  }
  function finish(ok){
    clearInterval(timer); timer=null;
    history.push({t:Date.now(),m:minutes,ok:ok,task:$("task").value.trim()}); save();
    setRunning(false); render();
    if(ok){$("plant").textContent=tree(minutes); fg.style.strokeDashoffset=0; say("🎉 Done! A new tree is growing in your garden."); document.title="🎉 Done!"}
    else{reset(); $("plant").textContent="🥀"; say("Your plant withered. Take a break, then plant again.")}
  }

  $("presets").addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b||b.disabled) return;
    minutes=+b.dataset.m;
    document.querySelectorAll("#presets button").forEach(function(x){x.classList.toggle("on",x===b)});
    reset(); say("");
  });
  $("start").addEventListener("click",function(){
    total=minutes*60; endAt=Date.now()+total*1000; say("Focusing… stay with it.");
    setRunning(true); tick(); timer=setInterval(tick,500);
  });
  $("giveup").addEventListener("click",function(){
    if(confirm("Give up? This plant will wither.")) finish(false);
  });
  $("clear").addEventListener("click",function(){
    if(history.length&&confirm("Clear all sessions?")){history=[];save();render();say("Garden cleared.")}
  });

  load(); render(); reset();
})();
</script>
</body>
</html>
